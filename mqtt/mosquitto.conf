# ตั้งให้ mosquitto ฟังที่ port 1883 (พอร์ตมาตรฐานของ MQTT)
listener 1883

# อนุญาตให้ client เชื่อมต่อได้โดยไม่ต้อง login (ไม่มี username/password)
# คำเตือน: ตั้งค่านี้เพื่อความสะดวกในการทดลองใช้งานในห้อง lab/บ้านเท่านั้น
# ห้ามเอาไปใช้ใน production จริงเด็ดขาด
allow_anonymous true

# สั่งให้ log ของ mosquitto ออกมาที่ stdout แทนที่จะเขียนลงไฟล์ในตัว container
log_dest stdout
